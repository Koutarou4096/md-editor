<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MarkDown Editor</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!--
    ==========================================================
    外部ライブラリ
    ==========================================================

    marked.js
      MarkdownをHTMLへ変換するライブラリ。

    DOMPurify
      marked.jsが生成したHTMLをサニタイズするライブラリ。
      Markdown内に意図しないHTMLや危険な属性が含まれていても、
      プレビューやHTML保存時にそのまま実行されないようにする。

    どちらもCDNから読み込んでいるため、
    インターネットに接続できない環境では利用できない場合がある。

    完全オフラインで動作させたい場合は、これらのライブラリを
    ローカルファイルとして同梱する必要がある。
  -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.3.0/purify.min.js"></script>

  <!--
    Google Fontsを読み込む。

    フォントが読み込めない場合でも、
    CSS側のsans-serif / monospaceへ自動的にフォールバックするため、
    フォントの読み込み失敗だけでアプリ全体が停止することはない。
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet">


  <style>
    /* ==========================================================
       デザイントークン
       ==========================================================

       色をここに集約している。

       ここだけ変更すれば、アプリ全体の配色をまとめて変更できる。
    ========================================================== */

    :root {
      --paper: #faf7f0;
      --paper-line: #847f73;
      --ink: #000000;
      --ink-soft: #5B6670;
      --hanko: #B23A2E;
      --hanko-dark: #8C2C22;
      --preview-bg: #FFFFFF;
      --gutter: #EFE9DA;
      --shadow: rgba(35, 48, 58, 0.08);
    }


    /* ==========================================================
       全要素共通
       ========================================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Noto Sans JP', sans-serif;

      /*
        ページ全体はスクロールさせず、
        エディタ・プレビューなどの内部領域だけをスクロールさせる。
      */
      overflow: hidden;
    }


    /* ==========================================================
       アプリ全体
       ========================================================== */

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }


    /* ==========================================================
       ヘッダー
       ========================================================== */

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 14px 24px;

      border-bottom: 1px solid var(--paper-line);
      background: var(--paper);

      /*
        ウィンドウが狭くなってもヘッダーそのものが
        Flexboxによって潰れないようにする。
      */
      flex-shrink: 0;
    }


    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }


    /* 印鑑風ロゴ */

    .hanko-mark {
      width: 34px;
      height: 34px;

      border-radius: 50%;
      border: 2px solid var(--hanko);

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: 'Shippori Mincho', serif;
      font-weight: 800;
      color: var(--hanko);
      font-size: 12px;
      letter-spacing: -0.02em;

      flex-shrink: 0;

      transition: transform 0.25s ease;
    }


    /*
      ファイル保存操作を行ったときに、
      JS側から .saved クラスを一時的に付ける。
    */

    .hanko-mark.saved {
      animation: stamp 0.35s ease;
    }


    @keyframes stamp {

      0% {
        transform: scale(1.6);
        opacity: 0;
      }

      60% {
        transform: scale(0.92);
        opacity: 1;
      }

      100% {
        transform: scale(1);
      }

    }


    .brand-text h1 {
      font-family: 'Shippori Mincho', serif;
      font-size: 18px;
      font-weight: 600;

      margin: 0;

      letter-spacing: 0.03em;
    }


    .brand-text p {
      margin: 0;

      font-size: 11px;
      color: var(--ink-soft);

      letter-spacing: 0.08em;
    }


    /* ==========================================================
       ツールバー
       ========================================================== */

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
    }


    /*
      文字数表示。

      min-widthを設定しているので、
      文字数が増えてもボタンの位置が大きく動かない。
    */

    .status {
      font-size: 12.5px;
      color: var(--ink-soft);

      font-family: 'JetBrains Mono', monospace;

      min-width: 120px;

      text-align: right;
    }


    /* ==========================================================
       ボタン
       ========================================================== */

    button {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 12.5px;
      font-weight: 500;

      border: 1px solid var(--paper-line);
      background: var(--paper);
      color: var(--ink);

      padding: 8px 14px;

      border-radius: 3px;

      cursor: pointer;

      transition:
        border-color 0.15s ease,
        color 0.15s ease,
        background-color 0.15s ease;
    }


    button:hover {
      border-color: var(--hanko);
      color: var(--hanko-dark);
    }


    /*
      キーボード操作でフォーカスした場合のみ、
      明確なフォーカスリングを表示する。

      マウス操作時には表示されないため、
      通常時の見た目を邪魔しない。
    */

    button:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--hanko);
      outline-offset: 1px;
    }


    /* クリアボタンなどの強調ボタン */

    button.primary {
      background: var(--hanko);
      border-color: var(--hanko);
      color: #fff;
    }


    button.primary:hover {
      background: var(--hanko-dark);
      border-color: var(--hanko-dark);
      color: #fff;
    }


    /* ==========================================================
       左右分割エリア
       ========================================================== */

    .panes {
      flex: 1;

      display: flex;

      /*
        Flexboxの子要素でoverflowを正しく動作させるために必要。
      */

      min-height: 0;
    }


    .pane {
      flex: 1;

      min-width: 0;

      display: flex;
      flex-direction: column;
    }


    .pane-label {
      font-family: 'Noto Sans JP', sans-serif;

      font-size: 12.5px;
      font-weight: 700;

      letter-spacing: 0.12em;

      color: var(--ink-soft);

      padding: 8px 20px;

      border-bottom: 1px solid var(--paper-line);

      flex-shrink: 0;

      text-transform: uppercase;
    }


    /* ==========================================================
       Markdownエディタ
       ==========================================================

       原稿用紙のような横罫線を背景に表示する。

       重要：
       backgroundの先頭に白い不透明レイヤーを置くと、
       下にあるrepeating-linear-gradientが完全に隠れてしまう。

       そのため、

         1. repeating-linear-gradient
         2. 背景色

       の順番にしている。
    ========================================================== */

    #editorPane {
      background: var(--paper);
      border-right: 1px solid var(--paper-line);
    }


    textarea {
      flex: 1;

      width: 100%;

      resize: none;

      border: none;
      outline: none;

      background: transparent;
      /* 親要素(#editorPane)の罫線背景を透過して見せる */

      font-family: 'JetBrains Mono', monospace;

      font-size: 14px;
      line-height: 28px;

      color: var(--ink);

      padding: 12px 24px 40px 24px;

      caret-color: var(--hanko);
    }


    textarea::placeholder {
      color: #B9B0A0;
    }


    /* ==========================================================
       中央の仕切り線
       ========================================================== */

    .divider {
      width: 1px;

      background: var(--paper-line);

      flex-shrink: 0;

      cursor: col-resize;

      position: relative;

      user-select: none;
    }


    .divider:hover {
      background: var(--hanko);
    }


    /*
      実際の線は1pxだが、
      左右4pxずつクリック判定を広げている。

      細い線でもドラッグしやすくするための処理。
    */

    .divider::after {
      content: '';

      position: absolute;

      top: 0;
      left: -4px;
      right: -4px;
      bottom: 0;
    }


    /* ==========================================================
       プレビュー
       ========================================================== */

    #previewPane {
      background: var(--preview-bg);
    }


    #preview {
      flex: 1;

      overflow-y: auto;

      padding: 20px 32px 60px 32px;

      font-family: 'Noto Sans JP', sans-serif;

      font-size: 15px;

      line-height: 1.85;

      color: var(--ink);
    }


    /* ==========================================================
       Markdownプレビューの装飾
       ========================================================== */

    #preview h1,
    #preview h2,
    #preview h3,
    #preview h4 {
      font-family: 'Noto Sans JP', sans-serif;

      font-weight: 600;

      color: var(--ink);

      line-height: 1.4;
    }


    #preview h1 {
      font-size: 28px;

      border-bottom: 2px solid var(--ink);

      padding-bottom: 10px;

      margin: 8px 0 20px;
    }


    #preview h2 {
      font-size: 21px;

      margin: 32px 0 14px;

      border-left: 4px solid var(--ink);

      padding-left: 10px;
    }


    #preview h3 {
      font-size: 17px;

      margin: 24px 0 10px;
    }


    #preview p {
      margin: 0 0 16px;
    }


    #preview a {
      color: var(--ink);

      text-decoration: underline;
    }


    #preview code {
      font-family: 'JetBrains Mono', monospace;

      background: #EEEEEE;

      padding: 2px 6px;

      border-radius: 3px;

      font-size: 13px;
    }


    #preview pre {
      background: var(--ink);

      color: #F3EFE4;

      padding: 16px 18px;

      border-radius: 5px;

      overflow-x: auto;

      margin: 0 0 18px;
    }


    #preview pre code {
      background: none;

      padding: 0;

      color: inherit;
    }


    #preview blockquote {
      margin: 0 0 18px;

      padding: 4px 18px;

      border-left: 3px solid #BBBBBB;

      color: var(--ink-soft);
    }


    #preview ul,
    #preview ol {
      margin: 0 0 16px;

      padding-left: 24px;
    }


    #preview li {
      margin-bottom: 6px;
    }


    #preview table {
      border-collapse: collapse;

      width: 100%;

      margin: 0 0 18px;

      font-size: 14px;
    }


    #preview th,
    #preview td {
      border: 1px solid #999999;

      padding: 8px 12px;

      text-align: left;
    }


    #preview th {
      background: #EEEEEE;

      font-weight: 600;
    }


    #preview img {
      max-width: 100%;

      border-radius: 4px;

      filter: grayscale(100%);
    }


    #preview hr {
      border: none;

      border-top: 1px solid #BBBBBB;

      margin: 28px 0;
    }


    /*
      プレビューが完全に空の場合だけ、
      「ここにプレビューが表示されます」と表示する。
    */

    #preview:empty::before {
      content: 'ここにプレビューが表示されます';

      color: #B9B0A0;
    }


    /* ==========================================================
       スマートフォン向けレスポンシブ対応
       ========================================================== */

    @media (max-width: 760px) {

      .panes {
        flex-direction: column;
      }


      /*
        スマートフォンでは左右分割ではなく上下分割になるため、
        中央のドラッグ用仕切りは不要。
      */

      .divider {
        display: none;
      }


      #editorPane {
        border-right: none;

        border-bottom: 1px solid var(--paper-line);
      }


      .brand-text p {
        display: none;
      }


      .status {
        display: none;
      }

    }


    /* ==========================================================
       アニメーション軽減設定
       ==========================================================

       OS側で「視差効果を減らす」「アニメーションを減らす」等が
       設定されている場合は押印アニメーションを無効化する。
    ========================================================== */

    @media (prefers-reduced-motion: reduce) {

      .hanko-mark.saved {
        animation: none;
      }

    }


    /* ==========================================================
       印刷 / PDF保存用CSS
       ========================================================== */

    @media print {

      /*
        画面表示時のスクロール制限を解除する。
      */

      html,
      body {
        height: auto;

        margin: 0;
        padding: 0;

        overflow: visible;

        background: #fff;
      }


      /*
        A4用紙に印刷するときの余白。

        ブラウザの印刷設定側で余白が指定されている場合は
        ブラウザ側の設定が優先される場合がある。
      */

      @page {
        size: A4;
        margin: 12mm;
      }


      /*
        紙に残す必要のないUIを非表示にする。
      */

      header,
      .pane-label,
      .divider,
      #editorPane {
        display: none !important;
      }


      /*
        画面用Flexレイアウトを解除し、
        プレビューだけを通常の文書として流す。
      */

      .app,
      .panes {
        height: auto;

        display: block;
      }


      #previewPane {
        display: block;

        width: 100%;
      }


      #preview {
        overflow: visible;

        padding: 0;

        font-size: 12.5pt;

        line-height: 1.7;
      }


      /*
        コードブロックの長い行が
        紙の右端からはみ出すのを防ぐ。
      */

      #preview pre {
        white-space: pre-wrap;

        word-break: break-word;

        overflow: visible;
      }


      /*
        見出しの直後でページが切れないようにする。
      */

      #preview h1,
      #preview h2,
      #preview h3,
      #preview h4 {
        break-after: avoid;

        page-break-after: avoid;
      }


      /*
        表・画像・コードブロックなどは
        可能な限り途中でページ分割しない。
      */

      #preview img,
      #preview table,
      #preview pre,
      #preview blockquote {
        break-inside: avoid;

        page-break-inside: avoid;
      }


      /*
        段落がページ末尾に1行だけ残るような状態を
        ある程度防ぐ。
      */

      #preview p,
      #preview li {
        orphans: 2;
        widows: 2;
      }

    }
  </style>
</head>


<body>

  <div class="app">

    <!-- ========================================================
         ヘッダー
         ======================================================== -->

    <header>

      <div class="brand">

        <!-- 印鑑風ロゴ -->

        <div class="hanko-mark" id="hankoMark" aria-label="Markdown Editor">
          MD
        </div>


        <div class="brand-text">

          <h1>MarkDown Editor</h1>

          <p>© こっちっちー</p>

        </div>


        <!--
          READMEとバグ報告フォーム。

          JavaScriptのonclickではなく、
          通常のイベントリスナーを使って処理する。
        -->

        <button id="readmeBtn">
          READMEを読む
        </button>

        <button id="bugReportBtn">
          バグ報告フォーム
        </button>

      </div>


      <div class="toolbar">

        <span class="status" id="statusText" aria-live="polite">
          0 文字
        </span>


        <button id="downloadMdBtn">
          .md を保存
        </button>


        <button id="downloadHtmlBtn">
          HTML を保存
        </button>


        <button id="printBtn">
          印刷 / PDF保存
        </button>


        <button class="primary" id="clearBtn">
          クリア
        </button>

      </div>

    </header>


    <!-- ========================================================
         エディタ + プレビュー
         ======================================================== -->

    <div class="panes">

      <!-- Markdown入力欄 -->

      <div class="pane" id="editorPane">

        <div class="pane-label">
          EDITOR
        </div>


        <!--
          spellcheck="false"

          ブラウザ標準のスペルチェックを無効化する。

          Markdown記法やプログラムコードが
          誤字として扱われるのを防ぐ。
        -->

        <textarea id="editor" spellcheck="false" placeholder="ここにMarkdownを入力してください…

# 見出し
本文を書きます。

- リスト項目1
- リスト項目2

```コード``` や **太字** も使えます。"></textarea>

      </div>


      <!-- エディタとプレビューの仕切り -->

      <div class="divider" id="divider" aria-hidden="true"></div>


      <!-- プレビュー -->

      <div class="pane" id="previewPane">

        <div class="pane-label">
          PREVIEW
        </div>


        <!--
          marked.js + DOMPurifyによって生成された
          安全化済みHTMLがここに入る。
        -->

        <div id="preview"></div>

      </div>

    </div>

  </div>


  <script>

    /* ==========================================================
       DOM要素の取得
       ==========================================================

       後で何度も使う要素を最初に取得しておく。

       毎回document.getElementById()を書く必要がなくなるので、
       コードが読みやすくなる。
    ========================================================== */

    const editor =
      document.getElementById('editor');

    const preview =
      document.getElementById('preview');

    const statusText =
      document.getElementById('statusText');

    const hankoMark =
      document.getElementById('hankoMark');

    const divider =
      document.getElementById('divider');

    const panes =
      document.querySelector('.panes');

    const editorPane =
      document.getElementById('editorPane');

    const previewPane =
      document.getElementById('previewPane');

    const downloadMdBtn =
      document.getElementById('downloadMdBtn');

    const downloadHtmlBtn =
      document.getElementById('downloadHtmlBtn');

    const printBtn =
      document.getElementById('printBtn');

    const clearBtn =
      document.getElementById('clearBtn');

    const readmeBtn =
      document.getElementById('readmeBtn');

    const bugReportBtn =
      document.getElementById('bugReportBtn');


    /* ==========================================================
       外部ライブラリの読み込み確認
       ==========================================================

       CDNからmarked.js / DOMPurifyが読み込めなかった場合、
       JavaScript全体が途中で停止してしまうのを防ぐ。

       このアプリはこれらのライブラリに依存しているため、
       読み込み失敗時にはプレビュー領域にエラーを表示する。
    ========================================================== */

    const librariesAvailable =
      typeof marked !== 'undefined' &&
      typeof DOMPurify !== 'undefined';


    if (!librariesAvailable) {

      preview.textContent =
        'Markdown変換ライブラリを読み込めませんでした。' +
        'インターネット接続を確認してください。';

      statusText.textContent =
        'ライブラリ読み込みエラー';

    }


    /* ==========================================================
       marked.jsの設定
       ==========================================================

       breaks: true
         Markdown内の改行をそのまま<br>として扱う。

       gfm: true
         GitHub Flavored Markdownを有効にする。

         表や取り消し線などの拡張記法を使用できる。
    ========================================================== */

    if (librariesAvailable) {

      marked.setOptions({
        breaks: true,
        gfm: true
      });

    }


    /* ==========================================================
       localStorage設定
       ==========================================================

       localStorageは、

         同じブラウザ
         +
         同じオリジン

       の中にデータを保存する仕組み。

       このアプリ自身にはサーバーやデータベースは存在しない。

       ただし、CDNやGoogle Fontsなどの外部リソースを
       読み込む通信は発生する。
    ========================================================== */

    const STORAGE_KEY =
      'markdown-editor-autosave';


    /* ==========================================================
       初期サンプル
       ========================================================== */

    const SAMPLE =
      "# ようこそ\n\n" +
      "左側に **Markdown** を入力すると、右側にリアルタイムでプレビューが表示されます。\n\n" +
      "## 使い方\n\n" +
      "1. 左のエリアに文章を書く\n" +
      "2. 右側でそのまま確認できる\n" +
      "3. 完成したら「.md を保存」または「HTML を保存」\n\n" +
      "> コードブロックや表、リンクにも対応しています。\n\n" +
      "```js\n" +
      "console.log('Hello, Markdown!');\n" +
      "```\n\n" +
      "| 項目 | 対応 |\n" +
      "| --- | --- |\n" +
      "| 見出し | ○ |\n" +
      "| リスト | ○ |\n" +
      "| 表 | ○ |\n";


    /* ==========================================================
       自動保存
       ==========================================================

       1文字入力するたびにlocalStorageへ保存すると、
       不必要に何度も書き込みが発生する。

       そこで「最後の入力から400ms操作がなかったら保存」
       というデバウンス処理を行う。

       例：

         A → B → C → D

       と短時間に連続入力した場合、

         A保存
         B保存
         C保存
         D保存

       ではなく、最後のD入力後に1回だけ保存する。
    ========================================================== */

    let saveTimer = null;


    function scheduleAutosave() {

      /*
        以前に予約した保存処理があればキャンセルする。
      */

      clearTimeout(saveTimer);


      /*
        新しく400ms後の保存処理を予約する。
      */

      saveTimer = setTimeout(() => {

        try {

          localStorage.setItem(
            STORAGE_KEY,
            editor.value
          );

        } catch (error) {

          /*
            localStorageが使用できない環境では
            自動保存だけを諦める。

            プレビューやファイル保存など、
            その他の機能はそのまま動作させる。
          */

        }


        /*
          タイマー処理が完了したので参照を消す。
        */

        saveTimer = null;

      }, 400);

    }


    /* ==========================================================
       Markdown → 安全なHTMLへの変換
       ==========================================================

       ここはセキュリティ上かなり重要。

       marked.parse()だけでは、
       Markdown内のHTMLをそのままHTMLとして扱える場合がある。

       例えば、

         <img src="..." ...>

       のようなHTMLがMarkdownに含まれていた場合、
       それをそのままinnerHTMLへ渡すと、
       意図しないHTMLが実行・表示される可能性がある。

       そこで、

         Markdown
             ↓
         marked.parse()
             ↓
         DOMPurify.sanitize()
             ↓
         安全化されたHTML

       という順番にする。
    ========================================================== */

    function renderMarkdown(markdown) {

      if (!librariesAvailable) {

        return '';

      }


      const rawHtml =
        marked.parse(markdown);


      /*
        markedが生成したHTMLをDOMPurifyでサニタイズする。

        これをプレビューだけでなく、
        HTMLファイル保存時にも共通して使用する。
      */

      return DOMPurify.sanitize(rawHtml, {
        USE_PROFILES: {
          html: true
        }
      });

    }


    /* ==========================================================
       プレビュー再描画
       ==========================================================

       1. textareaからMarkdownを取得
       2. marked.jsでHTMLへ変換
       3. DOMPurifyでサニタイズ
       4. プレビューへ表示
       5. 文字数を更新
    ========================================================== */

    function render() {

      const text =
        editor.value;


      if (!librariesAvailable) {

        statusText.textContent =
          'ライブラリ読み込みエラー';

        return;

      }


      const safeHtml =
        renderMarkdown(text);


      /*
        サニタイズ済みのHTMLだけをinnerHTMLへ入れる。
      */

      preview.innerHTML =
        safeHtml;


      /*
        JavaScriptのString.lengthは
        Unicodeの「見た目上の文字数」と完全に一致するわけではない。

        ただし、このアプリの文字数表示としては
        一般的なテキスト入力に対して十分実用的なので、
        現状はString.lengthを使用する。
      */

      statusText.textContent =
        text.length.toLocaleString('ja-JP') +
        ' 文字';

    }


    /* ==========================================================
       Markdown入力イベント
       ==========================================================

       入力が発生したら、

         1. 即座にプレビューを更新
         2. 自動保存を予約

       の両方を実行する。
    ========================================================== */

    editor.addEventListener(
      'input',
      () => {

        render();

        scheduleAutosave();

      }
    );


    /* ==========================================================
       localStorageから前回の内容を復元
       ========================================================== */

    let restored = false;


    try {

      const saved =
        localStorage.getItem(STORAGE_KEY);


      /*
        null
          → 保存データが存在しない

        ''
          → 明示的に空の状態で保存されている

        それ以外
          → 復元する
      */

      if (saved !== null) {
        editor.value = saved;
        restored = true;
      }
    } catch (error) {

      /*
        localStorageが使えない場合は
       サンプル文章を表示する。
      */

    }


    if (!restored) {

      editor.value =
        SAMPLE;

    }


    /*
      初期表示。
    */

    render();


    /* ==========================================================
       復元メッセージ
       ==========================================================

       localStorageから復元した場合だけ、
       5秒間ステータスを変更する。

       「キャッシュ」という表現ではなく、
       実際の仕組みに合わせて
       「前回の内容を復元しました」とする。
    ========================================================== */

    if (restored) {

      statusText.textContent =
        '前回の内容を復元しました';


      setTimeout(() => {

        statusText.textContent =
          editor.value.length
            .toLocaleString('ja-JP') +
          ' 文字';

      }, 5000);

    }


    /* ==========================================================
       押印アニメーション
       ==========================================================

       ファイル保存操作を行ったときに
       印鑑風ロゴをアニメーションさせる。

       これはブラウザが実際にファイルを保存したことを
       保証する処理ではない。

       あくまで、

         「保存処理を実行しました」

       というUI上のフィードバックとして使用する。
    ========================================================== */

    function stampSave() {

      hankoMark.classList.remove(
        'saved'
      );


      /*
        offsetWidthを読み込むことで、
        CSSアニメーションの状態をリセットする。
      */

      void hankoMark.offsetWidth;


      hankoMark.classList.add(
        'saved'
      );

    }


    /* ==========================================================
       ファイルダウンロード共通処理
       ==========================================================

       ブラウザだけでファイルを作成して保存する。

       1. Blobを作る
       2. 一時URLを作る
       3. <a download>を作る
       4. click()する
       5. 要素を削除
       6. 一時URLを解放
    ========================================================== */

    function downloadFile(
      filename,
      content,
      mime
    ) {

      const blob =
        new Blob(
          [content],
          {
            type: mime
          }
        );


      const url =
        URL.createObjectURL(blob);


      const a =
        document.createElement('a');


      a.href =
        url;

      a.download =
        filename;


      /*
        一時的にDOMへ追加する。

        一部ブラウザではDOMに存在しない<a>の
        programmatic clickが正常に動作しない場合があるため、
        明示的に追加してからクリックする。
      */

      document.body.appendChild(a);


      a.click();


      /*
        使用済み要素を削除する。
      */

      document.body.removeChild(a);


      /*
        一時URLを解放する。

        これを行わないと、
        ダウンロードするたびにメモリ上にBlob URLが残る。
      */

      URL.revokeObjectURL(url);


      /*
        保存「成功」の保証ではなく、
        保存処理を実行したことを示すUI演出。
      */

      stampSave();

    }


    /* ==========================================================
       Markdownファイル保存
       ========================================================== */

    downloadMdBtn.addEventListener(
      'click',
      () => {

        downloadFile(
          'document.md',
          editor.value,
          'text/markdown;charset=utf-8'
        );

      }
    );


    /* ==========================================================
       HTMLファイル保存
       ==========================================================

       重要：

       プレビューと同じDOMPurifyサニタイズ済みHTMLを
       使用する。

       以前のように、

         marked.parse(editor.value)

       を直接HTMLファイルへ入れない。
    ========================================================== */

    downloadHtmlBtn.addEventListener(
      'click',
      () => {

        if (!librariesAvailable) {

          alert(
            'Markdown変換ライブラリを読み込めないため、HTMLを保存できません。'
          );

          return;

        }


        const safeHtml =
          renderMarkdown(
            editor.value
          );


        const html =
          '<!DOCTYPE html>\n' +
          '<html lang="ja">\n' +
          '<head>\n' +
          '  <meta charset="UTF-8">\n' +
          '  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
          '  <title>document</title>\n' +
          '</head>\n' +
          '<body>\n' +
          safeHtml +
          '\n</body>\n' +
          '</html>';


        downloadFile(
          'document.html',
          html,
          'text/html;charset=utf-8'
        );

      }
    );


    /* ==========================================================
       印刷 / PDF保存
       ==========================================================

       ブラウザ標準の印刷画面を呼び出す。

       実際の印刷用レイアウトはCSSの
       @media print
       が担当する。
    ========================================================== */

    printBtn.addEventListener(
      'click',
      () => {

        /*
          ライブラリエラーなどでプレビューが正常に
          作成できていない場合は印刷を実行しない。
        */

        if (!librariesAvailable) {

          alert(
            'プレビューを正常に生成できないため、印刷できません。'
          );

          return;

        }


        window.print();

      }
    );


    /* ==========================================================
       クリア
       ========================================================== */

    clearBtn.addEventListener(
      'click',
      () => {

        /*
          内容が空なら確認なし。

          内容がある場合だけ確認する。
        */

        const shouldClear =
          editor.value.trim() === '' ||
          confirm(
            '入力内容をすべて消去しますか？\n\n' +
            '自動保存されている内容も削除されます。'
          );


        if (!shouldClear) {

          return;

        }


        /*
          重要：

          すでに400ms後のautosaveが予約されている場合、
          localStorageを削除した直後にそのタイマーが実行されると、

            「クリアしたはずなのに、古い内容が復活する」

          という状態になる。

          そのため、クリア処理では必ず
          予約済みタイマーもキャンセルする。
        */

        clearTimeout(saveTimer);

        saveTimer = null;


        /*
          エディタを空にする。
        */

        editor.value = '';


        /*
          プレビューを更新する。
        */

        render();


        /*
          localStorageから保存内容を削除する。
        */

        try {

          localStorage.removeItem(
            STORAGE_KEY
          );

        } catch (error) {

          /*
            localStorageが使えない場合は何もしない。
          */

        }


        /*
          クリア後はエディタへフォーカスを戻す。
        */

        editor.focus();

      }
    );


    /* ==========================================================
       READMEボタン
       ========================================================== */

    readmeBtn.addEventListener(
      'click',
      () => {

        location.href =
          'https://github.com/Koutarou4096/md-editor/blob/main/README.md';

      }
    );


    /* ==========================================================
       バグ報告フォーム
       ========================================================== */

    bugReportBtn.addEventListener(
      'click',
      () => {

        location.href =
          'https://forms.gle/mKzEKbLM7ak1PeKD9';

      }
    );


    /* ==========================================================
       エディタ / プレビュー幅の変更
       ==========================================================

       中央の仕切り線をドラッグすると、

         エディタ 20% ～ 80%
         プレビュー 80% ～ 20%

       の範囲で幅を変更できる。

       pointerイベントを使うことで、
       通常のマウス操作だけでなく、
       対応ブラウザではペンなどの入力にも対応できる。
    ========================================================== */

    let dragging = false;


    divider.addEventListener(
      'pointerdown',
      (event) => {

        /*
          スマートフォンではdivider自体を非表示にしているため、
          実際にはこのイベントはほぼ発生しない。

          念のため画面幅を確認する。
        */

        if (
          window.matchMedia(
            '(max-width: 760px)'
          ).matches
        ) {

          return;

        }


        dragging = true;


        /*
          pointer captureを取得する。

          ポインターが仕切り線から外れても、
          ドラッグイベントを受け取り続けられる。
        */

        divider.setPointerCapture(
          event.pointerId
        );


        document.body.style.cursor =
          'col-resize';


        /*
          ドラッグ中に文字を選択してしまうのを防ぐ。
        */

        document.body.style.userSelect =
          'none';

      }
    );


    divider.addEventListener(
      'pointermove',
      (event) => {

        if (!dragging) {

          return;

        }


        const rect =
          panes.getBoundingClientRect();


        let ratio =
          (event.clientX - rect.left) /
          rect.width;


        /*
          エディタ側を20～80%に制限する。
        */

        ratio =
          Math.min(
            0.8,
            Math.max(
              0.2,
              ratio
            )
          );


        /*
          エディタとプレビューの両方へ
          明示的にFlex比率を設定する。

          片側だけ設定すると、
          ブラウザのFlexbox計算によって
          意図しない比率になる場合がある。
        */

        editorPane.style.flex =
          ratio + ' 1 0';


        previewPane.style.flex =
          (1 - ratio) + ' 1 0';

      }
    );


    function stopDragging(event) {

      if (!dragging) {

        return;

      }


      dragging = false;


      /*
        pointer captureを解放する。
      */

      try {

        divider.releasePointerCapture(
          event.pointerId
        );

      } catch (error) {

        /*
          すでに解放済みの場合は何もしない。
        */

      }


      document.body.style.cursor =
        '';

      document.body.style.userSelect =
        '';

    }


    divider.addEventListener(
      'pointerup',
      stopDragging
    );


    divider.addEventListener(
      'pointercancel',
      stopDragging
    );


    /* ==========================================================
       Tabキーによるインデント
       ==========================================================

       通常のtextareaではTabキーを押すと
       次のフォーム要素へフォーカスが移動する。

       Markdown / コード編集ではTabを
       インデントとして使いたいため、
       半角スペース2個を挿入する。

       また、ここで直接editor.valueを書き換えると
       inputイベントが発火しない。

       そのため、

         render()
         scheduleAutosave()

       を明示的に呼ぶ必要がある。
    ========================================================== */

    editor.addEventListener(
      'keydown',
      (event) => {

        if (
          event.key !== 'Tab'
        ) {

          return;

        }


        event.preventDefault();


        const start =
          editor.selectionStart;


        const end =
          editor.selectionEnd;


        /*
          現在選択されている部分を
          半角スペース2個で置き換える。

          選択範囲がない場合は、
          カーソル位置へスペース2個を挿入する。
        */

        editor.value =
          editor.value.slice(0, start) +
          '  ' +
          editor.value.slice(end);


        /*
          挿入したスペースの直後へ
          カーソルを移動する。
        */

        editor.selectionStart =
          editor.selectionEnd =
          start + 2;


        /*
          Tabキーによる変更ではinputイベントが
          自動的に発火しないため、明示的に呼ぶ。
        */

        render();

        scheduleAutosave();

      }
    );


    /* ==========================================================
       ページ離脱直前の保険
       ==========================================================

       デバウンス中の内容がある場合、
       ページを閉じる直前に保存を試みる。

       ただし、beforeunload時のlocalStorage書き込みが
       全環境で完全に保証されるわけではないため、
       あくまで補助的な処理。
    ========================================================== */

    window.addEventListener(
      'beforeunload',
      () => {

        if (
          saveTimer !== null
        ) {

          clearTimeout(saveTimer);

          saveTimer = null;


          try {

            localStorage.setItem(
              STORAGE_KEY,
              editor.value
            );

          } catch (error) {

            /*
              保存できない環境では何もしない。
            */

          }

        }

      }
    );


  </script>

</body>

</html>
